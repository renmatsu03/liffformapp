<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>自習室_保護者レポート事前受け取り設定</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .card { max-width: 900px; margin: 32px auto; }
    .required { color: #d9534f; margin-left: 4px; }
    .note { font-size: 0.9rem; color: #555; background: #fff3cd; padding: 10px; border-radius: 6px; }
    input[type="submit"] { width: 50%; margin: 20px auto; display: block; padding: 12px; font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="card p-4">
    <h3 class="mb-3">オンライン自習室 — 参加申込フォーム</h3>

    <form id="apply-form" novalidate>
      <!-- LINE名（自動取得） -->
      <div class="form-group">
        <label>LINE名 <span class="required">*</span></label>
        <input type="text" class="form-control" id="line-name" name="lineName" readonly required placeholder="LINE名を取得中...">
        <small class="form-text text-muted">LINEの表示名を自動で取得します。編集不可。</small>
      </div>

      <!-- 生徒名（漢字） -->
      <div class="form-group">
        <label>生徒様のお名前（漢字） <span class="required">*</span></label>
        <div style="display: flex; gap: 10px;">
          <input type="text" class="form-control" id="student-lastname-kanji" name="studentLastNameKanji" required placeholder="例：山田" style="flex:1;">
          <input type="text" class="form-control" id="student-firstname-kanji" name="studentFirstNameKanji" required placeholder="例：太郎" style="flex:1;">
        </div>
      </div>

      <!-- 生徒名（ふりがな） -->
      <div class="form-group">
        <label>生徒様のお名前（ふりがな） <span class="required">*</span></label>
        <div style="display: flex; gap: 10px;">
          <input type="text" class="form-control" id="student-lastname-furi" name="studentLastNameFuri" required placeholder="例：やまだ" style="flex:1;">
          <input type="text" class="form-control" id="student-firstname-furi" name="studentFirstNameFuri" required placeholder="例：たろう" style="flex:1;">
        </div>
      </div>

      <!-- 学年 -->
      <div class="form-group">
        <label>学年 <span class="required">*</span></label>
        <select class="form-control" id="grade-select" name="grade" required>
          <option value="" disabled selected>選択してください</option>
          <option>小学6年生</option>
          <option>小学5年生</option>
          <option>小学4年生</option>
          <option>小学3年生</option>
          <option>小学2年生</option>
          <option>小学1年生</option>
          <option>その他（中学生）</option>
          <option>その他（高校生）</option>
        </select>
      </div>

      <!-- 注意書き -->
      <div class="form-group">
        <div class="note">
          ※こちらで回答した日程には全て参加を必須とするものではありません。<br>
          参加する可能性が少しでもある日程をお気軽に選択してください。<br>
          またこの時間帯の中で一部の時間帯（例えば18:00-19:00だけ）の利用も可能です！
        </div>
      </div>

      <!-- 自習室参加希望日（複数選択、最低1個必須） -->
      <div class="form-group">
        <label>自習室に参加し保護者レポート受け取りを希望する日（複数選択） <span class="required">*</span></label>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]" value="2025/11/25（火）16:00-19:00" id="d1">
          <label class="form-check-label" for="d1">2025/11/25（火）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/11/27（水）16:00-19:00" id="d2">
          <label class="form-check-label" for="d2">2025/11/26（水）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/11/28（木）16:00-19:00" id="d3">
          <label class="form-check-label" for="d3">2025/11/27（木）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/11/29（金）16:00-19:00" id="d4">
          <label class="form-check-label" for="d4">2025/11/28（金）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/11/30（土）09:00-12:00" id="d5">
          <label class="form-check-label" for="d5">2025/11/29（土）09:00-12:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/12/01（月）16:00-19:00" id="d6">
          <label class="form-check-label" for="d6">2025/12/01（月）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/12/02（火）16:00-19:00" id="d7">
          <label class="form-check-label" for="d7">2025/12/02（火）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]" value="2025/12/04（木）16:00-19:00" id="d8">
          <label class="form-check-label" for="d8">2025/12/04（木）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/12/05（金）16:00-19:00" id="d9">
          <label class="form-check-label" for="d9">2025/12/05（金）16:00-19:00</label>
        </div>
        <div class="form-check">
          <input class="form-check-input session-checkbox" type="checkbox" name="sessions[]"  value="2025/12/06（土）09:00-12:00" id="d10">
          <label class="form-check-label" for="d10">2025/12/06（土）16:00-19:00</label>
        </div>
        <small class="form-text text-muted">※最低1つ以上選択してください。上限はありません。</small>
      </div>

      <!-- Teachのご利用状況（任意、単一選択） -->
      <div class="form-group">
        <label>Teachのご利用状況（任意）</label>
        <select class="form-control" id="teach-usage" name="teachUsage">
          <option value="" selected>選択しない</option>
          <option>複数回授業を受けたことがある</option>
          <option>1回だけ授業を受けたことがある</option>
          <option>生徒登録だけしているが授業は受けたことがない</option>
          <option>Teachをまだ利用していない</option>
        </select>
      </div>

      <!-- フリーテキスト（任意） -->
      <div class="form-group">
        <label>オンライン自習室やレポートの受け取りに関して質問があればご記入ください（任意）</label>
        <textarea class="form-control" id="free-text" name="freeText" rows="4" placeholder="例：○月○日のみ参加できない／保護者へはLINEで送ってほしい、など"></textarea>
      </div>

      <input type="submit" id="submit-btn" class="btn btn-primary" value="送信（LINEへ）" disabled>
      <div id="form-msg" class="mt-3 text-danger" style="display:none;"></div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("JSエラー:", message, "at", source, "line", lineno);
      // デバッグ用：本番環境では削除またはコメントアウト
      // alert("JSエラー:" + message);
    };

    // jQueryが読み込まれたことを確認
    if (typeof jQuery === 'undefined') {
      console.error("jQueryが読み込まれていません");
    }

    $(document).ready(function() {
      const liffId = "2006856244-4nX8lL5Y"; // 必要に応じて置き換えてください

      // フォームのバリデーション（最低1個のチェックを含む）
      function validateForm() {
        // 要素が存在するか確認（安全のため）
        const $lineName = $("#line-name");
        const $lastnameKanji = $("#student-lastname-kanji");
        const $firstnameKanji = $("#student-firstname-kanji");
        const $lastnameFuri = $("#student-lastname-furi");
        const $firstnameFuri = $("#student-firstname-furi");
        const $gradeSelect = $("#grade-select");
        
        // 要素が存在しない場合は早期リターン
        if (!$lineName.length || !$lastnameKanji.length || !$firstnameKanji.length || 
            !$lastnameFuri.length || !$firstnameFuri.length || !$gradeSelect.length) {
          console.error("必要なフォーム要素が見つかりません");
          return false;
        }
        
        const lineName = $lineName.val() ? $lineName.val().trim() : "";
        // 【修正】姓と名を結合して取得（nullチェック付き）
        const lastnameKanji = $lastnameKanji.val() ? $lastnameKanji.val().trim() : "";
        const firstnameKanji = $firstnameKanji.val() ? $firstnameKanji.val().trim() : "";
        const lastnameFuri = $lastnameFuri.val() ? $lastnameFuri.val().trim() : "";
        const firstnameFuri = $firstnameFuri.val() ? $firstnameFuri.val().trim() : "";
        
        const studentKanji = (lastnameKanji + " " + firstnameKanji).trim();
        const studentFuri = (lastnameFuri + " " + firstnameFuri).trim();
        const grade = $gradeSelect.val() || "";
        const sessionsChecked = $(".session-checkbox:checked").length;

        // 必須条件
        const ok = lineName !== "" &&
                   lastnameKanji !== "" &&
                   firstnameKanji !== "" &&
                   lastnameFuri !== "" &&
                   firstnameFuri !== "" &&
                   grade !== "" &&
                   sessionsChecked >= 1;

        // エラーメッセージ（簡易）
        const errors = [];
        if (!lineName) errors.push("LINE名が取得できていません。LINEアプリ内で実行してください。");
        if (!lastnameKanji) errors.push("生徒様のお名前（漢字・姓）を入力してください。");
        if (!firstnameKanji) errors.push("生徒様のお名前（漢字・名）を入力してください。");
        if (!lastnameFuri) errors.push("生徒様のお名前（ふりがな・姓）を入力してください。");
        if (!firstnameFuri) errors.push("生徒様のお名前（ふりがな・名）を入力してください。");
        if (!grade) errors.push("学年を選択してください。");
        if (sessionsChecked < 1) errors.push("自習室参加希望日は最低1つ以上選択してください。");

        if (ok) {
          $("#form-msg").hide().text("");
        } else {
          $("#form-msg").show().html(errors.join("<br>"));
        }

        $("#submit-btn").prop("disabled", !ok);
        return ok;
      }

      // LIFF 初期化してLINE名を取得
      liff.init({ liffId: liffId })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile()
              .then(profile => {
                $("#line-name").val(profile.displayName || "");
                validateForm();
              })
              .catch(err => {
                console.error("プロフィール取得エラー:", err);
                validateForm();
              });
          } else {
            // LIFF外で実行された場合はログインを試みる（必要に応じて）
            try {
              liff.login();
            } catch (e) {
              console.warn("LIFF login failed or not available.", e);
            }
            validateForm();
          }
        })
        .catch(err => {
          console.error("LIFF 初期化エラー:", err);
          validateForm();
        });

      // 入力や選択が変わったら検証
      // 【修正】正しいIDを指定
      $("#student-lastname-kanji, #student-firstname-kanji, #student-lastname-furi, #student-firstname-furi, #grade-select, #teach-usage, #free-text").on("input change", validateForm);
      $(document).on("change", ".session-checkbox", validateForm);

      // 送信処理
      $("#apply-form").on("submit", function(e) {
        e.preventDefault();
        if (!validateForm()) return false;

        // 安全に値を取得（nullチェック付き）
        const $lineName = $("#line-name");
        const $lastnameKanji = $("#student-lastname-kanji");
        const $firstnameKanji = $("#student-firstname-kanji");
        const $lastnameFuri = $("#student-lastname-furi");
        const $firstnameFuri = $("#student-firstname-furi");
        const $gradeSelect = $("#grade-select");
        const $teachUsage = $("#teach-usage");
        const $freeText = $("#free-text");
        
        const lineName = $lineName.val() ? $lineName.val().trim() : "";
        // 【修正】姓と名を結合して取得
        const lastnameKanji = $lastnameKanji.val() ? $lastnameKanji.val().trim() : "";
        const firstnameKanji = $firstnameKanji.val() ? $firstnameKanji.val().trim() : "";
        const lastnameFuri = $lastnameFuri.val() ? $lastnameFuri.val().trim() : "";
        const firstnameFuri = $firstnameFuri.val() ? $firstnameFuri.val().trim() : "";
        
        const studentKanji = (lastnameKanji + " " + firstnameKanji).trim();
        const studentFuri = (lastnameFuri + " " + firstnameFuri).trim();
        const grade = $gradeSelect.val() || "";
        const sessions = $(".session-checkbox:checked").map(function(){ return $(this).val(); }).get();
        const teachUsage = $teachUsage.val() || "未選択";
        const freeText = $freeText.val() ? $freeText.val().trim() : "特になし";

        // LINEに送るメッセージ
        const msgLines = [
          "#オンライン自習室参加申込",
          `LINE名: ${lineName}`,
          `生徒名（漢字）: ${studentKanji}`,
          `生徒名（ふりがな）: ${studentFuri}`,
          `学年: ${grade}`,
          "参加希望日（保護者レポート受け取り）:",
          sessions.map(s => `- ${s}`).join("\n"),
          `Teachの利用状況: ${teachUsage}`,
          `備考: ${freeText}`
        ];
        const message = msgLines.join("\n");

        // ▼（追加）GASへ送信するデータ
        // 【修正】キー名（GAS側で受け取る名前）: 変数名（上で定義した名前） の形式にします
        const payload = {
          lineName: lineName,
          studentNameKanji: studentKanji, // 修正: 変数 studentKanji を代入
          studentNameFuri: studentFuri,   // 修正: 変数 studentFuri を代入
          grade: grade,
          sessions: sessions,
          teachUsage: teachUsage,
          freeText: freeText
        };

        // ▼（追加）GAS Web API へ POST
        fetch("https://script.google.com/macros/s/AKfycbxiL3E08j9zW80DblhXUyv_HsbSmWIxh21-UwTWUCVpDEcHhkmvt9WBrurmLIzLCeX8-w/exec", {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // ▼ メッセージ送信（LINE）
        if (liff.isInClient()) {
          liff.sendMessages([{ type: 'text', text: message }])
            .then(() => {
              alert("申込内容が送信されました。運営よりご連絡いたします。");
              liff.closeWindow();
            })
            .catch(err => {
              console.error("メッセージ送信失敗:", err);
              alert("送信に失敗しました。時間をおいて再度お試しください。");
            });
        } else {
          alert("LINEアプリ内で実行してください。");
        }
      });

      // ページ読み込み時の初期検証
      validateForm();
    });
  </script>
</body>
</html>
